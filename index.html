<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleach: Türkiye - Official RPG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --bg-deep: #050508;
            --reiatsu-cyan: #00e5ff;
            --reiatsu-purple: #9d00ff;
            --quincy-blue: #0055ff;
            --hollow-crimson: #ff003c;
            --silver: #e0e6ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
    width: 100%;
    height: 100%; /* <-- This is the culprit */
    background-color: var(--bg-deep);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

        /* Ambient Environment Layers */
        .environment {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 85, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(157, 0, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 229, 255, 0.15) 0%, transparent 60%);
            mix-blend-mode: screen;
        }

        .volumetric-rays {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 0%, 
                transparent 0deg, 
                rgba(0, 229, 255, 0.03) 45deg, 
                transparent 90deg, 
                rgba(157, 0, 255, 0.02) 135deg, 
                transparent 180deg);
            animation: rotateRays 60s linear infinite;
            z-index: 2;
        }

        /* Magic Seals & HUD Elements */
        .ui-seals {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .seal {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1), inset 0 0 20px rgba(0, 229, 255, 0.1);
        }

        .seal.outer {
            width: 800px; height: 800px;
            border-style: dashed;
            animation: spin 40s linear infinite;
        }

        .seal.middle {
            width: 650px; height: 650px;
            border: 2px solid rgba(157, 0, 255, 0.15);
            border-style: dotted;
            animation: spinReverse 30s linear infinite;
        }

        .seal.inner {
            width: 500px; height: 500px;
            border: 1px solid rgba(224, 230, 237, 0.1);
            animation: spin 20s linear infinite;
        }

        /* Central Typography Logo */
        .logo-container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-family: 'Cinzel Decorative', serif;
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
            
            /* Metallic Gradient Texture */
background: linear-gradient(to bottom, #ffffff 0%, #b0c4de 40%, #7a8b99 50%, #dbe4eb 60%, #ffffff 100%);
background-clip: text; /* Add this standard property */
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
            /* Atmospheric Glow */
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.4)) drop-shadow(0 0 30px rgba(0, 85, 255, 0.2));
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            color: var(--silver);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            position: relative;
        }

        .subtitle::before, .subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 150px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--reiatsu-cyan), transparent);
        }

        .subtitle::before { left: -180px; }
        .subtitle::after { right: -180px; }

        /* HUD RPG Elements */
        .rpg-hud {
            position: absolute;
            bottom: 50px;
            width: 80%;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(224, 230, 237, 0.6);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hud-item:hover {
            color: var(--reiatsu-cyan);
            text-shadow: 0 0 8px var(--reiatsu-cyan);
        }

        .hud-icon {
            width: 30px; height: 30px;
            border: 1px solid currentColor;
            transform: rotate(45deg);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .hud-icon::after {
            content: '';
            width: 10px; height: 10px;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        /* Particle Canvas */
        #reiatsu-particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
        @keyframes rotateRays { 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.3)) drop-shadow(0 0 30px rgba(0, 85, 255, 0.1)); }
            100% { filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.6)) drop-shadow(0 0 50px rgba(157, 0, 255, 0.3)); }
        }

    </style>
</head>
<body>

    <div class="environment"></div>
    <div class="volumetric-rays"></div>

    <div class="ui-seals">
        <div class="seal outer"></div>
        <div class="seal middle"></div>
        <div class="seal inner"></div>
    </div>

    <canvas id="reiatsu-particles"></canvas>

    <div class="logo-container">
        <h1 class="logo">BLEACH: TÜRKİYE</h1>
        <div class="subtitle">Official Roleplay Server</div>
    </div>

    <div class="rpg-hud">
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--reiatsu-cyan);"></div>
            <span>Shikai & Bankai</span>
        </div>
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--hollow-crimson);"></div>
            <span>Hollow Evolution</span>
        </div>
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--quincy-blue);"></div>
            <span>Quincy Schrift</span>
        </div>
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--reiatsu-purple);"></div>
            <span>Clans & Guilds</span>
        </div>
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--silver);"></div>
            <span>World Economy</span>
        </div>
    </div>

    <script>
        // Reiatsu Particle Engine
        const canvas = document.getElementById('reiatsu-particles');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        const colors = ['#00e5ff', '#9d00ff', '#ffffff', '#0055ff'];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * -1 - 0.5; // Float upwards
                this.speedX = (Math.random() - 0.5) * 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                
                // Reset at bottom when floating out of top bounds
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        
        init();
        animate();
    </script>
</body>
</html>
