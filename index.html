<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleach: Türkiye RPG | Spirit Rebirth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --bg-deep: #050508;
            --reiatsu-cyan: #00e5ff;
            --reiatsu-purple: #9d00ff;
            --quincy-blue: #0055ff;
            --hollow-crimson: #ff003c;
            --silver: #e0e6ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            min-height: 700px;
            background-color: var(--bg-deep);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ambient Environment Layers */
        .environment {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 85, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(157, 0, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 229, 255, 0.15) 0%, transparent 60%);
            mix-blend-mode: screen;
        }

        .volumetric-rays {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 0deg at 50% 0%, 
                transparent 0deg, 
                rgba(0, 229, 255, 0.03) 45deg, 
                transparent 90deg, 
                rgba(157, 0, 255, 0.02) 135deg, 
                transparent 180deg);
            animation: rotateRays 60s linear infinite;
            z-index: 2;
        }

        /* Top Navigation Menu */
        .top-nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 25px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(to bottom, rgba(5,5,8,0.8), transparent);
        }

        .nav-logo {
            font-family: 'Cinzel Decorative', serif;
            color: var(--silver);
            font-size: 1.5rem;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .nav-logo span {
            color: var(--reiatsu-cyan);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            display: block;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: rgba(224, 230, 237, 0.7);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--reiatsu-cyan);
            text-shadow: 0 0 10px var(--reiatsu-cyan);
        }

        /* Launcher Side Panel (Discord & Steps) */
        .launcher-panel {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            background: rgba(10, 10, 15, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            z-index: 20;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0, 229, 255, 0.05);
        }

        .panel-title {
            color: var(--silver);
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .steps-list {
            margin-top: 15px;
            list-style: none;
            color: rgba(224, 230, 237, 0.7);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .steps-list li {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .steps-list li span {
            color: var(--reiatsu-cyan);
            font-weight: bold;
        }

        /* Magic Seals & HUD Elements */
        .ui-seals {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .seal {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.1), inset 0 0 20px rgba(0, 229, 255, 0.1);
        }

        .seal.outer {
            width: 800px; height: 800px;
            border-style: dashed;
            animation: spin 40s linear infinite;
        }

        .seal.middle {
            width: 650px; height: 650px;
            border: 2px solid rgba(157, 0, 255, 0.15);
            border-style: dotted;
            animation: spinReverse 30s linear infinite;
        }

        .seal.inner {
            width: 500px; height: 500px;
            border: 1px solid rgba(224, 230, 237, 0.1);
            animation: spin 20s linear infinite;
        }

        /* Central Typography Logo */
        .logo-container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Shift slightly left to balance the right panel */
            margin-left: -150px; 
        }

        .logo {
            font-family: 'Cinzel Decorative', serif;
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            margin-bottom: 10px;
            
            /* Metallic Gradient Texture */
            background: linear-gradient(to bottom, #ffffff 0%, #b0c4de 40%, #7a8b99 50%, #dbe4eb 60%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Atmospheric Glow */
            filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.4)) drop-shadow(0 0 30px rgba(0, 85, 255, 0.2));
            animation: pulseGlow 4s ease-in-out infinite alternate;
        }

        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            color: var(--silver);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            position: relative;
            margin-bottom: 40px;
        }

        .subtitle::before, .subtitle::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 150px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--reiatsu-cyan), transparent);
        }

        .subtitle::before { left: -180px; }
        .subtitle::after { right: -180px; }

        .btn-play {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--reiatsu-cyan);
            color: #fff;
            padding: 15px 50px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-play:hover {
            background: rgba(0, 229, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.6), inset 0 0 20px rgba(0, 229, 255, 0.4);
            transform: scale(1.05);
        }

        /* HUD RPG Elements */
        .rpg-hud {
            position: absolute;
            bottom: 50px;
            width: 80%;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: rgba(224, 230, 237, 0.6);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hud-item:hover {
            color: var(--reiatsu-cyan);
            text-shadow: 0 0 8px var(--reiatsu-cyan);
        }

        .hud-icon {
            width: 30px; height: 30px;
            border: 1px solid currentColor;
            transform: rotate(45deg);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .hud-icon::after {
            content: '';
            width: 10px; height: 10px;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        /* Particle Canvas */
        #reiatsu-particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
        @keyframes rotateRays { 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.3)) drop-shadow(0 0 30px rgba(0, 85, 255, 0.1)); }
            100% { filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.6)) drop-shadow(0 0 50px rgba(157, 0, 255, 0.3)); }
        }

    </style>
</head>
<body>

    <div class="environment"></div>
    <div class="volumetric-rays"></div>

    <nav class="top-nav">
        <a href="#" class="nav-logo">BLEACH:TR <span>DISCORD RPG BOT</span></a>
        <ul class="nav-links">
            <li><a href="#">Ana Sayfa</a></li>
            <li><a href="#ozellikler">Özellikler</a></li>
            <li><a href="komutlar.html">Rehber</a></li>
        </ul>
    </nav>

    <div class="ui-seals">
        <div class="seal outer"></div>
        <div class="seal middle"></div>
        <div class="seal inner"></div>
    </div>

    <canvas id="reiatsu-particles"></canvas>

    <div class="logo-container">
        <h1 class="logo">BLEACH: TÜRKİYE</h1>
        <div class="subtitle">Ruh Enerjini Serbest Bırak!</div>
        <a href="https://discord.gg/a4Waxzyuz7" target="_blank" class="btn-play">HEMEN BAŞLA</a>
    </div>

    <div class="launcher-panel">
        <div class="panel-title">Canlı Sunucu Durumu</div>
        <iframe src="https://discord.com/widget?id=1517560912578478112&theme=dark" width="100%" height="300" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts" style="border-radius: 8px; border: none;"></iframe>
        
        <ul class="steps-list">
            <li><span>1.</span> Sunucuya Katıl</li>
            <li><span>2.</span> Irkını Seç</li>
            <li><span>3.</span> Maceraya Atıl</li>
        </ul>
    </div>

    <div class="rpg-hud" id="ozellikler">
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--reiatsu-cyan);"></div>
            <span>Savaş & Farm</span>
        </div>
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--hollow-crimson);"></div>
            <span>Görev Sistemi</span>
        </div>
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--quincy-blue);"></div>
            <span>Muken Zindanları</span>
        </div>
        <div class="hud-item">
            <div class="hud-icon" style="color: var(--reiatsu-purple);"></div>
            <span>Market & Envanter</span>
        </div>
        <a href="komutlar.html" class="hud-item" style="color: rgba(224, 230, 237, 0.6);">
            <div class="hud-icon" style="color: var(--silver);"></div>
            <span>Komut Rehberi</span>
        </a>
    </div>

    <script>
        const canvas = document.getElementById('reiatsu-particles');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const colors = ['#00e5ff', '#9d00ff', '#ffffff', '#0055ff'];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedY = Math.random() * -1 - 0.5;
                this.speedX = (Math.random() - 0.5) * 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
