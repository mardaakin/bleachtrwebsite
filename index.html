<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLEACH: TÜRKİYE | AAA MMORPG Deneyimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           1. DEĞİŞKENLER & TEMEL AYARLAR
           ========================================== */
        :root {
            --bg-0: #050507;
            --bg-1: #0c0d14;
            --bg-2: #12131f;
            --bg-3: #171826;
            --bg-4: #1d1e2e;
            
            --cyan-reiatsu: #00e5ff;
            --purple-reiatsu: #9d00ff;
            --royal-blue: #0044ff;
            --electric-blue: #0088ff;
            --gold: #ffd700;
            --white-light: #ffffff;
            --red-alert: #ff003c;

            --glass-bg: rgba(12, 13, 20, 0.4);
            --glass-border: rgba(0, 229, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* Özel imleç için varsayılanı kapatıyoruz */
        }

        body {
            background-color: var(--bg-0);
            color: var(--white-light);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 50%, var(--bg-1) 0%, var(--bg-0) 100%);
        }

        h1, h2, h3, h4, .cinematic-text {
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        /* ==========================================
           2. ÖZEL İMLEÇ (CUSTOM CURSOR)
           ========================================== */
        .cursor-dot {
            width: 8px; height: 8px;
            background: var(--cyan-reiatsu);
            box-shadow: 0 0 15px var(--cyan-reiatsu), 0 0 30px var(--cyan-reiatsu);
            position: fixed; border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
        }
        .cursor-outline {
            width: 40px; height: 40px;
            border: 1px solid rgba(0, 229, 255, 0.5);
            position: fixed; border-radius: 50%;
            pointer-events: none; z-index: 9998;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, background 0.2s;
        }

        /* ==========================================
           3. SİNEMATİK YÜKLEME EKRANI (LOADER)
           ========================================== */
        #loader {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-0); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1.5s ease-out, visibility 1.5s;
        }
        .loader-logo {
            font-size: 3rem; font-family: 'Cinzel', serif; letter-spacing: 10px;
            color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.2);
            position: relative; animation: pulseLogo 2s infinite alternate;
        }
        .loader-logo::after {
            content: 'BLEACH: TÜRKİYE'; position: absolute; left: 0; top: 0;
            color: var(--cyan-reiatsu); filter: blur(10px); opacity: 0.5;
        }
        .loader-bar-container {
            width: 300px; height: 2px; background: rgba(255,255,255,0.1);
            margin-top: 30px; position: relative; overflow: hidden;
        }
        .loader-bar {
            height: 100%; width: 0%; background: var(--cyan-reiatsu);
            box-shadow: 0 0 20px var(--cyan-reiatsu);
            animation: fillBar 3s cubic-bezier(0.8, 0, 0.2, 1) forwards;
        }
        @keyframes pulseLogo { 0% { text-shadow: 0 0 10px rgba(0,229,255,0); } 100% { text-shadow: 0 0 30px rgba(0,229,255,0.8); } }
        @keyframes fillBar { 0% { width: 0%; } 100% { width: 100%; } }

        /* ==========================================
           4. 10 KATMANLI DİNAMİK ARKA PLAN
           ========================================== */
        .bg-layer {
            position: fixed; top: -5%; left: -5%; width: 110vw; height: 110vh;
            pointer-events: none; z-index: -10; background-size: cover; background-position: center;
        }
        /* Layer 1-4: Atmosfer (CSS ile simüle edilmiştir, projede buralara imaj eklenebilir) */
        #layer-stars { background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 50px 50px; animation: rotateBg 200s linear infinite; }
        #layer-fog { background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.005" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.08"/></svg>'); animation: panFog 60s linear infinite alternate; }
        #layer-moon { background: radial-gradient(circle at 50% 30%, rgba(255,255,255,0.1) 0%, transparent 20%); }
        #canvas-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -5; pointer-events: none; }
        
        @keyframes rotateBg { 100% { transform: rotate(360deg); } }
        @keyframes panFog { 0% { transform: scale(1.1) translate(0,0); } 100% { transform: scale(1.3) translate(-2%, 2%); } }

        /* ==========================================
           5. NAVBAR (GLASSMORPHISM)
           ========================================== */
        nav {
            position: fixed; top: 0; width: 100%; padding: 25px 50px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100; transition: all 0.4s ease;
            background: linear-gradient(to bottom, rgba(5,5,7,0.9), transparent);
        }
        nav.scrolled {
            padding: 15px 50px; background: var(--glass-bg);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .nav-logo { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 5px; color: var(--white-light); text-shadow: 0 0 15px rgba(255,255,255,0.3); }
        .nav-links { display: flex; gap: 40px; list-style: none; }
        .nav-links a {
            color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.9rem;
            letter-spacing: 2px; text-transform: uppercase; position: relative; transition: color 0.3s;
        }
        .nav-links a:hover { color: var(--cyan-reiatsu); text-shadow: 0 0 10px var(--cyan-reiatsu); }
        .nav-links a::after {
            content: ''; position: absolute; bottom: -5px; left: 0; width: 0%; height: 1px;
            background: var(--cyan-reiatsu); box-shadow: 0 0 10px var(--cyan-reiatsu); transition: width 0.3s;
        }
        .nav-links a:hover::after { width: 100%; }
        
        .btn-premium {
            background: rgba(0, 229, 255, 0.05); border: 1px solid var(--cyan-reiatsu);
            color: var(--cyan-reiatsu); padding: 12px 30px; font-family: 'Cinzel', serif;
            font-weight: 700; letter-spacing: 2px; position: relative; overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); text-decoration: none; display: inline-block;
        }
        .btn-premium::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.5), transparent); transition: left 0.5s;
        }
        .btn-premium:hover {
            background: rgba(0, 229, 255, 0.2); box-shadow: 0 0 30px rgba(0, 229, 255, 0.6), inset 0 0 20px rgba(0, 229, 255, 0.4);
            color: #fff; transform: scale(1.05); text-shadow: 0 0 10px #fff;
        }
        .btn-premium:hover::before { left: 100%; }

        /* ==========================================
           6. HERO SECTION
           ========================================== */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; perspective: 1000px; overflow: hidden;
        }
        .hero-content {
            text-align: center; z-index: 10; transform-style: preserve-3d;
            animation: heroReveal 2s cubic-bezier(0.19, 1, 0.22, 1) 2.5s both;
        }
        .hero-subtitle {
            font-family: 'Inter', sans-serif; font-weight: 300; letter-spacing: 15px;
            color: var(--cyan-reiatsu); font-size: 1rem; margin-bottom: 20px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
        .hero-title {
            font-size: 8rem; font-weight: 900; line-height: 1; margin-bottom: 40px;
            color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.8);
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="%23fff"/></svg>') repeat;
            -webkit-background-clip: text; background-clip: text;
            text-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 100px rgba(0, 229, 255, 0.3);
            position: relative;
        }
        .hero-title::after {
            content: 'BLEACH: TÜRKİYE'; position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            color: var(--cyan-reiatsu); z-index: -1; filter: blur(20px); opacity: 0.4;
        }
        .hero-buttons { display: flex; gap: 30px; justify-content: center; }
        
        @keyframes heroReveal { 0% { opacity: 0; transform: translateY(100px) scale(0.9) rotateX(10deg); filter: blur(20px); } 100% { opacity: 1; transform: translateY(0) scale(1) rotateX(0deg); filter: blur(0); } }

        /* ==========================================
           7. İSTATİSTİKLER (SCROLL REVEAL)
           ========================================== */
        .section-divider {
            height: 150px; width: 100%; position: relative; display: flex; justify-content: center; align-items: center; margin: 50px 0;
        }
        .section-divider::before {
            content: ''; width: 80%; height: 2px; background: linear-gradient(90deg, transparent, var(--cyan-reiatsu), transparent);
            box-shadow: 0 0 20px var(--cyan-reiatsu); opacity: 0.5;
        }
        
        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; padding: 0 10%; position: relative; z-index: 10;
        }
        .stat-card {
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            padding: 40px 20px; text-align: center; border-radius: 4px; box-shadow: var(--glass-shadow);
            transform: translateY(50px); opacity: 0; transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative; overflow: hidden;
        }
        .stat-card.visible { transform: translateY(0); opacity: 1; }
        .stat-card::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
            background: var(--cyan-reiatsu); transform: scaleX(0); transition: transform 0.5s;
        }
        .stat-card:hover::after { transform: scaleX(1); }
        .stat-card:hover { transform: translateY(-10px); border-color: rgba(0, 229, 255, 0.5); box-shadow: 0 15px 40px rgba(0, 229, 255, 0.15); }
        
        .stat-number { font-family: 'Cinzel', serif; font-size: 3.5rem; color: var(--white-light); text-shadow: 0 0 20px rgba(255,255,255,0.3); margin-bottom: 10px; }
        .stat-label { font-size: 0.85rem; color: var(--cyan-reiatsu); letter-spacing: 3px; text-transform: uppercase; }

        /* ==========================================
           8. ÖZEL KARTLAR (Bölüm 2 için altyapı)
           ========================================== */
        .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; padding: 100px 10%; perspective: 1500px; }
        .feature-card {
            height: 400px; background: var(--bg-2); border: 1px solid rgba(255,255,255,0.05);
            position: relative; transform-style: preserve-3d; transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            opacity: 0; transform: translateY(100px) rotateX(10deg);
        }
        .feature-card.visible { opacity: 1; transform: translateY(0) rotateX(0deg); }
        /* Kart içerikleri ve detaylı 3D hover efektleri bir sonraki aşamada eklenecek */

    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-logo">BLEACH: TÜRKİYE</div>
        <div class="loader-bar-container"><div class="loader-bar"></div></div>
    </div>

    <div class="cursor-dot" id="cursor-dot"></div>
    <div class="cursor-outline" id="cursor-outline"></div>

    <div class="bg-layer" id="layer-stars"></div>
    <div class="bg-layer" id="layer-fog"></div>
    <div class="bg-layer" id="layer-moon"></div>
    <canvas id="canvas-particles"></canvas>

    <nav id="navbar">
        <div class="nav-logo">BLEACH</div>
        <ul class="nav-links">
            <li><a href="#home">Ana Sayfa</a></li>
            <li><a href="#universe">Evren</a></li>
            <li><a href="#features">Özellikler</a></li>
            <li><a href="#races">Irklar</a></li>
            <li><a href="#wiki">Wiki</a></li>
        </ul>
        <a href="https://discord.gg/a4Waxzyuz7" target="_blank" class="btn-premium interactable">SUNUCUYA KATIL</a>
    </nav>

    <section class="hero" id="home">
        <div class="hero-content" id="parallax-target">
            <h2 class="hero-subtitle">Türkiye'nin En Gelişmiş Discord MMORPG Deneyimi</h2>
            <h1 class="hero-title">BLEACH:<br>TÜRKİYE</h1>
            <div class="hero-buttons">
                <a href="https://discord.gg/a4Waxzyuz7" target="_blank" class="btn-premium interactable" style="padding: 20px 50px; font-size: 1.2rem;">SUNUCUYA KATIL</a>
                <a href="#commands" class="btn-premium interactable" style="padding: 20px 50px; font-size: 1.2rem; background: transparent; border-color: rgba(255,255,255,0.2); color: #fff;">KOMUTLARI İNCELE</a>
            </div>
        </div>
    </section>

    <div class="section-divider"></div>

    <section class="stats-grid">
        <div class="stat-card interactable reveal-on-scroll">
            <div class="stat-number" data-target="15420">0</div>
            <div class="stat-label">Kayıtlı Karakter</div>
        </div>
        <div class="stat-card interactable reveal-on-scroll" style="transition-delay: 0.1s;">
            <div class="stat-number" data-target="89240">0</div>
            <div class="stat-label">Toplam Savaş</div>
        </div>
        <div class="stat-card interactable reveal-on-scroll" style="transition-delay: 0.2s;">
            <div class="stat-number" data-target="3450">0</div>
            <div class="stat-label">Kesilen Boss</div>
        </div>
        <div class="stat-card interactable reveal-on-scroll" style="transition-delay: 0.3s;">
            <div class="stat-number" data-target="128">0</div>
            <div class="stat-label">Kurulu Klan</div>
        </div>
    </section>

    <script>
        // 1. LOADER MANTIĞI
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => { document.getElementById('loader').style.visibility = 'hidden'; }, 1500);
            }, 3000); // 3 saniyelik sinematik açılış
        });

        // 2. ÖZEL İMLEÇ (MOUSE TRACKING & HOVER EFEKTLERİ)
        const dot = document.getElementById('cursor-dot');
        const outline = document.getElementById('cursor-outline');
        
        window.addEventListener('mousemove', (e) => {
            dot.style.left = `${e.clientX}px`; dot.style.top = `${e.clientY}px`;
            outline.animate({ left: `${e.clientX}px`, top: `${e.clientY}px` }, { duration: 500, fill: "forwards" });
        });

        document.querySelectorAll('a, .interactable').forEach(el => {
            el.addEventListener('mouseenter', () => {
                outline.style.transform = 'translate(-50%, -50%) scale(2)';
                outline.style.backgroundColor = 'rgba(0, 229, 255, 0.1)';
                outline.style.borderColor = 'rgba(0, 229, 255, 1)';
            });
            el.addEventListener('mouseleave', () => {
                outline.style.transform = 'translate(-50%, -50%) scale(1)';
                outline.style.backgroundColor = 'transparent';
                outline.style.borderColor = 'rgba(0, 229, 255, 0.5)';
            });
        });

        // 3. NAVBAR GLASSMORPHISM SCROLL EFEKTİ
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });

        // 4. PARALLAX HERO EFEKTİ (MOUSE İLE)
        const parallaxTarget = document.getElementById('parallax-target');
        const layers = document.querySelectorAll('.bg-layer');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            parallaxTarget.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            
            // Arkaplan katmanları da hafifçe hareket etsin
            layers.forEach(layer => {
                layer.style.transform = `translate(${xAxis * 1.5}px, ${yAxis * 1.5}px)`;
            });
        });

        // 5. INTERSECTION OBSERVER (Scroll ile Element Görünürlüğü ve Sayaç Animasyonu)
        const observerOptions = { threshold: 0.1, rootMargin: "0px 0px -50px 0px" };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    
                    // Sayaç tetikleyici
                    if(entry.target.classList.contains('stat-card')) {
                        const counter = entry.target.querySelector('.stat-number');
                        const target = +counter.getAttribute('data-target');
                        let count = 0;
                        const increment = target / 100; // Hız ayarı
                        
                        const updateCount = () => {
                            count += increment;
                            if (count < target) {
                                counter.innerText = Math.ceil(count).toLocaleString('tr-TR');
                                requestAnimationFrame(updateCount);
                            } else {
                                counter.innerText = target.toLocaleString('tr-TR');
                            }
                        };
                        updateCount();
                    }
                    observer.unobserve(entry.target);
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));

        // 6. REIATSU PARTICLE ENGINE (CANVAS)
        const canvas = document.getElementById('canvas-particles');
        const ctx = canvas.getContext('2d');
        let width, height, particles;

        function initParticles() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2.5 + 0.5,
                    dx: (Math.random() - 0.5) * 0.5,
                    dy: -Math.random() * 1.5 - 0.5, // Yukarı doğru süzülme
                    alpha: Math.random() * 0.5 + 0.1,
                    color: Math.random() > 0.2 ? '0, 229, 255' : '157, 0, 255' // Cyan ve Mor Reiatsu
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.x += p.dx; p.y += p.dy;
                if (p.y < 0) { p.y = height; p.x = Math.random() * width; }
                
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${p.color}, 0.8)`;
                ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }

        window.addEventListener('resize', initParticles);
        initParticles(); drawParticles();
    </script>
</body>
</html>
