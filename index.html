<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bleach: Türkiye RPG | Official Launcher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap');

        :root {
            --bg-deep: #020306;
            --reiatsu-cyan: #00e5ff;
            --reiatsu-purple: #9d00ff;
            --quincy-blue: #0055ff;
            --hollow-crimson: #ff003c;
            --silver: #e0e6ed;
            --panel-bg: rgba(10, 12, 18, 0.65);
            --border-glow: rgba(0, 229, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            min-height: 768px;
            background-color: var(--bg-deep);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: var(--silver);
        }

        /* Ambient Environment */
        .environment {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: 
                radial-gradient(circle at 15% 40%, rgba(0, 229, 255, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 60%, rgba(157, 0, 255, 0.06) 0%, transparent 50%);
            mix-blend-mode: screen;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Top Navigation */
        .top-nav {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            background: linear-gradient(to bottom, rgba(2,3,6,0.9) 0%, transparent 100%);
        }

        .nav-logo {
            font-family: 'Cinzel Decorative', serif;
            color: var(--silver);
            font-size: 1.8rem;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            line-height: 0.9;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
        }

        .nav-logo span {
            color: var(--reiatsu-cyan);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: rgba(224, 230, 237, 0.6);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--reiatsu-cyan);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 50%;
            transform: translateX(-50%);
            width: 0; height: 2px;
            background: var(--reiatsu-cyan);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px var(--reiatsu-cyan);
        }

        .nav-links a:hover::after { width: 100%; }

        /* Main Launcher Layout */
        .launcher-layout {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 400px; /* Left takes remaining space, right takes 400px */
            padding: 120px 60px 100px 60px; /* Leave room for nav and HUD */
        }

        /* Left Side: Game Branding & Play */
        .hero-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding-right: 40px;
        }

        .main-logo {
            font-family: 'Cinzel Decorative', serif;
            font-size: 5.5rem;
            font-weight: 900;
            letter-spacing: 0.1em;
            margin-bottom: 5px;
            line-height: 1.1;
            
            /* Metallic Gradient */
            background: linear-gradient(180deg, #ffffff 0%, #c4d3df 40%, #8598a8 50%, #e0e9f0 60%, #ffffff 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.2));
        }

        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.4em;
            color: rgba(224, 230, 237, 0.8);
            text-transform: uppercase;
            margin-bottom: 50px;
            padding-left: 5px;
            border-left: 3px solid var(--reiatsu-cyan);
            padding-left: 15px;
        }

        .play-action {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-play {
            background: rgba(0, 229, 255, 0.05);
            border: 1px solid var(--reiatsu-cyan);
            color: #fff;
            padding: 20px 70px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2), inset 0 0 15px rgba(0, 229, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-play::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg);
            transition: 0.5s;
        }

        .btn-play:hover::before { left: 150%; }
        
        .btn-play:hover {
            background: rgba(0, 229, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.4), inset 0 0 20px rgba(0, 229, 255, 0.3);
            text-shadow: 0 0 10px #fff;
        }

        /* Right Side: Sidebar Panel */
        .sidebar {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .launcher-panel {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 2px solid var(--reiatsu-cyan);
            backdrop-filter: blur(20px);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0, 229, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-title {
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-title::before {
            content: '';
            width: 8px; height: 8px;
            background: var(--reiatsu-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--reiatsu-cyan);
        }

        .discord-wrapper {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            padding: 5px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .steps-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .steps-list li {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 12px 15px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.95rem;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .steps-list li:hover {
            background: rgba(0, 229, 255, 0.05);
            border-color: rgba(0, 229, 255, 0.3);
            transform: translateX(5px);
        }

        .step-num {
            color: var(--reiatsu-cyan);
            font-weight: 700;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(0,229,255,0.5);
        }

        /* Bottom HUD Bar */
        .bottom-hud {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 0 60px;
            height: 80px;
            background: linear-gradient(to top, rgba(2,3,6,0.9) 0%, transparent 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Align left to match flow */
            gap: 60px;
            z-index: 20;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(224, 230, 237, 0.5);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .hud-item:hover {
            color: #fff;
        }

        .hud-icon {
            width: 24px; height: 24px;
            border: 1px solid currentColor;
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .hud-icon::after {
            content: '';
            width: 8px; height: 8px;
            background: currentColor;
            box-shadow: 0 0 10px currentColor;
        }

        .hud-item:hover .hud-icon {
            box-shadow: 0 0 15px currentColor, inset 0 0 10px currentColor;
        }

        /* Particles */
        #reiatsu-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="environment"></div>
    <div class="scanlines"></div>
    <canvas id="reiatsu-particles"></canvas>

    <nav class="top-nav">
        <a href="#" class="nav-logo">BLEACH:TR <span>OFFICIAL RPG</span></a>
        <ul class="nav-links">
            <li><a href="#">Ana Sayfa</a></li>
            <li><a href="#ozellikler">Özellikler</a></li>
            <li><a href="komutlar.html">Rehber</a></li>
        </ul>
    </nav>

    <div class="launcher-layout">
        
        <div class="hero-section">
            <h1 class="main-logo">BLEACH: TÜRKİYE</h1>
            <div class="subtitle">Ruh Enerjini Serbest Bırak</div>
            <div class="play-action">
                <a href="https://discord.gg/a4Waxzyuz7" target="_blank" class="btn-play">HEMEN BAŞLA</a>
            </div>
        </div>

        <div class="sidebar">
            <div class="launcher-panel">
                <div class="panel-title">Canlı Sunucu Durumu</div>
                <div class="discord-wrapper">
                    <iframe src="https://discord.com/widget?id=1517560912578478112&theme=dark" width="100%" height="320" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts" style="border: none;"></iframe>
                </div>
                
                <ul class="steps-list">
                    <li><span class="step-num">01.</span> Sunucuya Katıl</li>
                    <li><span class="step-num">02.</span> Irkını Seç</li>
                    <li><span class="step-num">03.</span> Maceraya Atıl</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="bottom-hud" id="ozellikler">
        <div class="hud-item" style="color: var(--reiatsu-cyan);">
            <div class="hud-icon"></div>
            <span>Savaş & Farm</span>
        </div>
        <div class="hud-item" style="color: var(--hollow-crimson);">
            <div class="hud-icon"></div>
            <span>Görev Sistemi</span>
        </div>
        <div class="hud-item" style="color: var(--quincy-blue);">
            <div class="hud-icon"></div>
            <span>Muken Zindanları</span>
        </div>
        <div class="hud-item" style="color: var(--reiatsu-purple);">
            <div class="hud-icon"></div>
            <span>Market & Envanter</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('reiatsu-particles');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];
        const colors = ['#00e5ff', '#9d00ff', '#ffffff', '#0055ff'];

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            // Less particles for a cleaner AAA look
            for (let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = Math.random() * -0.5 - 0.2; // Slower float
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                if (this.y < 0) {
                    this.y = height;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', init);
        init();
        animate();
    </script>
</body>
</html>
